<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      var location = window.location;
      var segments = location.pathname
        .slice(1)
        .split('/')
        .map(function (segment) {
          return segment.replace(/&/g, '~and~');
        });
      var redirect =
        location.protocol +
        '//' +
        location.hostname +
        (location.port ? ':' + location.port : '') +
        '/?/' +
        segments.join('/') +
        (location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : '') +
        location.hash;
      location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
