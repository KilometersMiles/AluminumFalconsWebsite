<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aluminum Falcons</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function (location) {
        var redirect = location.search[1] === '/';
        if (redirect) {
          var route = location.search
            .slice(1)
            .split('&')
            .map(function (value) {
              return value.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            route + location.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
